[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-ai-chats-mcp"
version = "0.2.0"
description = "MCP server and CLI tool to sync, import, index (SQLite FTS5), and search all your Google AI interactions (Gemini, Google Search AI Mode, AI Studio, NotebookLM, Ask Maps, YouTube AI, My Activity) in Google Antigravity, Claude Code, and Cursor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Travis Pflanz" }
]
keywords = [
    "gemini",
    "mcp",
    "model-context-protocol",
    "antigravity",
    "chat-history",
    "google-takeout",
    "playwright",
    "sqlite-fts5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.49.0",
]

[project.scripts]
google-ai-chats = "gemini_web_chats.cli:main"
gemini-web-chats = "gemini_web_chats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_web_chats"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
